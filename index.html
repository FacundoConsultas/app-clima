<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador de Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Clima en Tiempo Real</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Escribe una ciudad...">
            <button id="searchBtn">Buscar</button>
        </div>
        <div id="weatherResult" class="result-card">
            <p>Busca una ciudad para ver el clima</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
